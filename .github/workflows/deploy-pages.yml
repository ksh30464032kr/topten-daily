name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check API URL
        run: node -e "const u = new URL(process.env.NEXT_PUBLIC_API_BASE); if (u.protocol !== 'https:') throw Error('API_BASE_URL must use HTTPS')"
      - name: Install
        run: npm ci
      - name: Test OCR connection handling
        run: node scripts/test-ocr-connection.mjs
      - name: Test OCR quantity ranking
        run: python3 scripts/test-ocr-ranking.py
      - name: Build static site
        run: npm run build
      - name: Verify Pages artifact
        run: node scripts/verify-pages.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
